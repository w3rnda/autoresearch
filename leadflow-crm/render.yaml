# Render Blueprint — deploys backend + Postgres + Redis as a unit
# Use: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: leadflow-backend
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: leadflow-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: leadflow-redis
          type: keyvalue
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: leadflow-redis
          type: keyvalue
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ENABLE_GTM_WORKERS
        value: "true"
      - key: APIFY_API_TOKEN
        sync: false  # set manually in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually
      - key: FRONTEND_URL
        sync: false  # set after Vercel deploy

databases:
  - name: leadflow-postgres
    databaseName: leadflow
    plan: free
    postgresMajorVersion: 15

  - name: leadflow-redis
    type: keyvalue
    plan: free
