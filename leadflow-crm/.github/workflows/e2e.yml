name: E2E Tests

on:
  push:
    branches: [main, master, claude/**]
    paths:
      - 'leadflow-crm/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'leadflow-crm/**'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: leadflow-crm

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: leadflow
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            leadflow-crm/server/package-lock.json
            leadflow-crm/client/package-lock.json
            leadflow-crm/tests/package-lock.json

      - name: Install backend
        working-directory: leadflow-crm/server
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run seed
        env:
          DATABASE_URL: postgresql://leadflow:leadflow123@localhost:5432/leadflow

      - name: Start backend
        working-directory: leadflow-crm/server
        run: |
          node src/server.js &
          for i in {1..30}; do
            curl -s http://localhost:3001/health && break
            sleep 1
          done
        env:
          DATABASE_URL: postgresql://leadflow:leadflow123@localhost:5432/leadflow
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret-not-for-production-use-only-in-ci
          JWT_REFRESH_SECRET: test-refresh-secret-not-for-production-ci-only
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          NODE_ENV: test
          PORT: 3001
          FRONTEND_URL: http://localhost:5173
          ENABLE_GTM_WORKERS: 'true'

      - name: Install frontend
        working-directory: leadflow-crm/client
        run: npm ci

      - name: Start frontend
        working-directory: leadflow-crm/client
        run: |
          npm run dev &
          for i in {1..30}; do
            curl -s http://localhost:5173 && break
            sleep 1
          done
        env:
          VITE_API_URL: http://localhost:3001

      - name: Install Playwright
        working-directory: leadflow-crm/tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: leadflow-crm/tests
        run: npx playwright test
        env:
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:3001

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: leadflow-crm/tests/playwright-report/
          retention-days: 7
